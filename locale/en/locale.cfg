[mod-name]
carry=Carry

[mod-description]
carry=Pick up a section of your base and put it down somewhere else, as it is: buildings with what's in them, belts with their items, recipes, fluids and wires. Drag over it with the Carry tool, then click where it goes (R turns it). Instant, no robots.

[item-name]
carry-tool=Carry

[item-description]
carry-tool=Drag over a section of your base: it goes into your hand. Click where it should go (R turns it) and it is moved there as it is, with what's in it.

[shortcut-name]
carry-tool=Carry a section

[controls]
carry-tool=Carry a section

[carry]
title=Carry
picked=__1__ buildings in your hand: click where they go (R turns them; shift-click clears trees and rocks)
left=(trains and cars stay where they are)
nothing=Nothing of yours to carry there
moved=Moved __1__ buildings, with what's in them.
cleared=__1__ __plural_for_parameter__1__{1=tree or rock|rest=trees and rocks}__ cleared out of the way.
dropped=__1__ circuit __plural_for_parameter__1__{1=wire|rest=wires}__ to outside the section dropped.
back=Move back
back-tip=Put the section back where it was (the same way: as it is now)
close=Close
blocked=__1__ in the way there
blocked-shift=__1__ in the way there (shift-click clears trees and rocks)
no-flip=Carry can't flip a section yet: put it down unflipped
no-turn-rails=Carry can't turn rails yet: put it down unturned
other-surface=It goes back on the surface you picked it up from
changed=Something of the section was removed meanwhile: pick it up again
cant-land=Couldn't work out where it goes
cant-clone=Couldn't move that
cant-clone-x=Couldn't move __1__ (another mod's): nothing moved
gone=Something of the section is gone
none=Nothing to move back
